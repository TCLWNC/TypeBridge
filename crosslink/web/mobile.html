<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<title>跨屏输入</title>
<link rel="stylesheet" href="/assets/base.css" />
<style>
  html, body { height: 100%; background: var(--bg); }
  body { overflow: hidden; }
  .shell {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding-top: env(safe-area-inset-top);
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px 10px;
  }
  header .grow { flex: 1; min-width: 0; }
  header .pc { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { color: var(--text-3); font-size: 12px; display: flex; align-items: center; gap: 6px; margin-top: 2px; }

  .target-bar {
    margin: 0 18px 10px;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--r-md);
    background: var(--surface-2); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--text-2);
    transition: border-color var(--d2) var(--ease), background-color var(--d2) var(--ease);
  }
  .target-bar.ready { border-color: rgba(76, 208, 125, .38); }
  .target-bar.warn { border-color: rgba(242, 193, 78, .42); }
  .target-bar .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .editor { flex: 1; min-height: 0; position: relative; margin: 0 18px; overflow: hidden; }
  textarea {
    display: block; width: 100%; height: 100%;
    padding: 16px 16px 46px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    color: var(--text);
    font-size: 17px; line-height: 1.6;
    resize: none; outline: none;
    transition: border-color var(--d2) var(--ease);
    overflow-y: auto;
  }
  textarea:focus { border-color: rgba(180, 197, 255, .45); }
  .counter {
    position: absolute; right: 14px; bottom: 12px;
    color: var(--text-3); font-size: 12px;
    background: rgba(0, 0, 0, .35); padding: 2px 8px; border-radius: 999px;
  }

  .keys {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 18px 4px;
    scrollbar-width: none;
  }
  .keys::-webkit-scrollbar { display: none; }
  .key {
    flex: none; height: 38px; min-width: 44px; padding: 0 14px;
    display: grid; place-items: center;
    border-radius: var(--r-full);
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text-2); font-size: 13.5px; font-weight: 600;
  }
  .key:hover { background: var(--state); color: var(--text); }

  .bottom {
    padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  .modes { display: flex; justify-content: center; }
  .actions { display: flex; align-items: center; gap: 10px; }
  .actions .grow { flex: 1; }
  .send {
    flex: 1; height: 50px; border-radius: var(--r-full);
    background: var(--primary); color: var(--on-primary);
    font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background-color var(--d2) var(--ease), transform var(--d1) var(--ease), opacity var(--d2) var(--ease);
  }
  .send:hover { background: var(--primary-hi); }
  .send.off { opacity: .4; pointer-events: none; }
  .round {
    width: 50px; height: 50px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
  }
  .round:hover { background: var(--state); color: var(--text); }
  .round svg { width: 22px; height: 22px; }

  /* 连接页 */
  .gate {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 32px; text-align: center;
  }
  .gate.hide { animation: gateOut var(--d3) var(--ease) forwards; }
  @keyframes gateOut {
    to { opacity: 0; transform: scale(1.02); visibility: hidden; }
  }
  .gate h1 { margin: 0; font-size: 24px; }
  .gate p { margin: 0; color: var(--text-3); font-size: 13px; max-width: 320px; line-height: 1.7; }
  .gate .field { text-align: center; letter-spacing: 8px; font-size: 20px; max-width: 220px; }
  .pulse-ring {
    width: 96px; height: 96px; border-radius: 50%;
    border: 2px solid rgba(180, 197, 255, .35);
    display: grid; place-items: center; margin-bottom: 6px;
    animation: breathe 2.4s var(--ease) infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: .9; }
    50% { transform: scale(1.06); opacity: .6; }
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    background: var(--card);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform var(--d3) var(--ease-emph);
  }
  .sheet.show { transform: none; }
  .sheet .handle { width: 40px; height: 4px; border-radius: 999px; background: var(--state-2); margin: 0 auto 14px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="avatar" style="width:42px;height:42px;border-radius:14px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20.5h8"/><path d="M12 17v3.5"/>
      </svg>
    </div>
    <div class="grow">
      <div class="pc" id="pc-name">正在连接电脑…</div>
      <div class="sub"><i class="dot live" id="dot"></i><span id="status">已连接同一 Wi-Fi</span></div>
    </div>
    <button class="btn icon fx" id="btn-more" title="更多">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9">
        <circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>
      </svg>
    </button>
  </header>

  <div class="target-bar" id="target-bar">
    <i class="dot" id="target-dot"></i>
    <span class="grow" id="target-text">先在电脑上点一下要输入的窗口</span>
  </div>

  <div class="editor">
    <textarea id="input" placeholder="在这里打字…" autocomplete="off" autocorrect="off"
              autocapitalize="off" spellcheck="false"></textarea>
    <div class="counter" id="counter">0 字</div>
  </div>

  <div class="keys" id="keys"></div>

  <div class="bottom">
    <div class="modes">
      <div class="segmented" id="mode">
        <div class="thumb"></div>
        <button data-v="live" class="active">即打即输</button>
        <button data-v="batch">编辑后发送</button>
      </div>
    </div>
    <div class="actions">
      <button class="round fx" id="btn-clear" title="清空输入框">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>
        </svg>
      </button>
      <button class="round fx" id="btn-restore" title="还原上次发送的内容">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
        </svg>
      </button>
      <button class="send fx" id="btn-send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M4 12l16-8-6 8 6 8-16-8Z"/>
        </svg>发送到电脑
      </button>
    </div>
  </div>
</div>

<!-- 首次进入：等待配对 -->
<div class="gate" id="gate">
  <div class="pulse-ring">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#B4C5FF" stroke-width="1.6">
      <rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20.5h8"/>
    </svg>
  </div>
  <h1>正在连接电脑</h1>
  <p id="gate-text">正在和电脑握手…</p>
  <div id="pin-box" style="display:none;flex-direction:column;gap:10px;align-items:center">
    <input class="field" id="pin-input" inputmode="numeric" maxlength="4" placeholder="····" />
    <button class="btn filled fx" id="pin-go">连接</button>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="dialog" id="dialog"></div></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="card-title">更多</div>
  <div class="row"><div class="grow"><div class="name">发送后自动回车</div><div class="sub">发完自动敲一次回车</div></div>
    <button class="switch" id="sw-enter" role="switch"></button></div>
  <div class="row"><div class="grow"><div class="name">重新连接</div><div class="sub">换网络或断开后点这里</div></div>
    <button class="btn sm outline fx" id="btn-reconnect">重连</button></div>
  <div class="row"><div class="grow"><div class="name">电脑地址</div><div class="sub mono" id="addr">-</div></div></div>
</div>

<div class="toast-wrap" id="toasts"></div>
<script src="/assets/i18n.js"></script>
<script src="/assets/mobile.js"></script>
</body>
</html>
